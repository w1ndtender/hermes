_config_version: 46
agent:
  fast_auto_seconds: 60
  max_turns: 500
  personalities: {}
  reasoning_effort: medium
  service_tier: ''
  verbose: false
approvals:
  cron_mode: approve
  destructive_slash_confirm: false
  mode: 'off'
auth:
  adopt_external_logins: true
  codex_login_flow: device_code
browser:
  extension_control:
    enabled: false
  inactivity_timeout: 120
code_execution:
  max_tool_calls: 50
  timeout: 300
compression:
  checkpoint_required: false
  codex_app_server_auto: native
  codex_gpt55_autoraise: true
  codex_responses_compact_threshold: null
  codex_responses_native: false
  enabled: true
  hygiene_max_turn_hold_seconds: 10
  idle_compact_after_seconds: 0
  max_attempts: 3
  min_tail_user_messages: 1
  proactive_prune_min_reclaim_tokens: '[REDACTED]'
  proactive_prune_min_result_chars: 8000
  proactive_prune_tokens: '[REDACTED]'
  progress_notices: false
  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.2
  threshold: 0.5
  threshold_tokens: '[REDACTED]'
cron:
  catch_up_missed: true
database:
  journal_mode: wal
delegation:
  max_iterations: 250
display:
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
  busy_ack_detail: true
  busy_input_mode: interrupt
  cleanup_progress: false
  compact: false
  interim_assistant_messages: true
  long_running_notifications: false
  platforms:
    lightclawbot:
      streaming: true
  show_reasoning: true
  skin: default
  streaming: true
  suppress_warning_notifications: false
  tool_progress: all
gateway:
  allow_all_users: false
  api_server:
    history_tool_output_max_chars: 0
    max_concurrent_runs: 10
  auto_multiplex_migration: true
  bot_loop_guard:
    cooldown_seconds: 600
    enabled: true
    max_events: 20
    window_seconds: 300
  delivery_ledger: true
  loop_watchdog: true
  loop_watchdog_max_strikes: 3
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  max_inbound_media_bytes: 134217728
  media_delivery_allow_dirs: []
  message_timestamps:
    enabled: false
  multiplex_profiles: true
  platform_connect_timeout: 30
  profile_routes: []
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  restart_loop_guard:
    max_gap_seconds: 300
    max_restarts: 3
    window_seconds: 60
  scale_to_zero:
    idle_timeout_minutes: 2
  signal_interrupt_grace_timeout: 1
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  strict: false
  trust_env: true
  trust_recent_files: true
  trust_recent_files_seconds: 600
  write_sessions_json: true
group_sessions_per_user: true
kanban:
  review_dispatch: true
max_concurrent_sessions: null
memory:
  memory_char_limit: 2200
  memory_enabled: true
  nudge_interval: 10
  user_char_limit: 1375
  user_profile_enabled: true
model:
  api_mode: chat_completions
  base_url: https://api.deepseek.com/v1
  default: deepseek-flash
  provider: custom:deepseek
onboarding:
  seen:
    busy_input_prompt: true
    profile_build_offered: true
platform_toolsets:
  cli:
  - hermes-cli
  discord:
  - hermes-discord
  google_chat:
  - hermes-google_chat
  homeassistant:
  - hermes-homeassistant
  qqbot:
  - hermes-qqbot
  signal:
  - hermes-signal
  slack:
  - hermes-slack
  teams:
  - hermes-teams
  telegram:
  - hermes-telegram
  whatsapp:
  - hermes-whatsapp
  yuanbao:
  - hermes-yuanbao
platforms:
  lightclawbot:
    enabled: true
plugins:
  clone_timeout_seconds: 300
  disabled: []
  enabled:
  - lightclawbot
  - weixinpay
  entries:
    weixinpay:
      allow_gateway_injection: true
      allow_tool_override: true
prompt_caching:
  cache_ttl: 5m
providers:
  deepseek:
    api_mode: chat_completions
    available_models_json:
    - id: deepseek-v4-pro
      name: DeepSeek V4 Pro
    - id: deepseek-flash
      name: DeepSeek V4.1 Flash
    base_url: https://api.deepseek.com/v1
    key_env: '[REDACTED]'
    model: deepseek-flash
    model_display_name: DeepSeek V4.1 Flash
    protocol: ''
runtime:
  nofile_soft_limit: 4096
skills:
  creation_nudge_interval: 15
streaming:
  enabled: false
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    language: ''
    max_retries: 1
    model: whisper-1
    timeout: 60
telemetry:
  shared_metrics:
    enabled: false
    send: false
terminal:
  backend: local
  container_cpu: 1
  container_disk: 51200
  container_memory: 5120
  container_persistent: true
  cwd: .
  docker_mount_cwd_to_workspace: false
  home_mode: auto
  lifetime_seconds: 300
  timeout: 180
tool_loop_guardrails:
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
    same_tool_failure: 8
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    idempotent_no_progress: 2
    same_tool_failure: 3
  warnings_enabled: true
updates:
  backup_keep: 5
  check: true
  non_interactive_local_changes: stash
  pre_update_backup: false
